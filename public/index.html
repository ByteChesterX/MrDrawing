<!doctype html><html lang="tr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>MrDrawing</title>
<style>
:root{
  --bg:#0a0a12; --card:#11131e; --accent:#ff1744; --accent2:#7b2cbf;
  --text:#e8e8f0; --muted:#6b6b80; --success:#06d6a0; --error:#ff4466;
  --canvas-bg:#fff; --panel:#1a1d28; --border:#2a2d38;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',system-ui,Helvetica,Arial,sans-serif}
html,body{height:100%;overflow:hidden;background:var(--bg)}
#root{height:100%}

@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.5}}
@keyframes shake{0%,100%{transform:translateX(0)}25%,75%{transform:translateX(-4px)}50%{transform:translateX(4px)}}

/* Header */
header{padding:20px 24px;background:linear-gradient(135deg,var(--card),var(--bg));backdrop-filter:blur(20px)}
.hdr{max-width:1200px;margin:0 auto;display:flex;justify-content:space-between;align-items:center}
.title h1{font-size:28px;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:4px}
.title p{color:var(--muted);font-size:12px}

/* Controls */
.ctrls{display:flex;gap:8px}
.btn{padding:10px 18px;font-size:13px;font-weight:600;border:0;border-radius:6px;cursor:pointer;transition:transform 0.15s,box-shadow 0.15s;letter-spacing:0.3px}
.btn-start{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.btn-start:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(255,23,68,0.4)}
.btn-start:active{transform:translateY(1px)}
.btn-grey{background:var(--border);color:var(--text)}
.btn-grey:hover{background:#3a3d4a}

/* Main */
.main{flex:1;display:flex;gap:6px;padding:24px;overflow:hidden}
.canvas-w{flex:1;position:relative;background:var(--canvas-bg)}
#status{position:absolute;top:12px;left:12px;background:rgba(0,0,0,0.75);color:var(--text);padding:8px 14px;border-radius:6px;font-size:12px;font-weight:600;backdrop-filter:blur(4px)}
#canvas{width:100%;height:calc(100vh - 180px);background:#fff;border-radius:16px;display:block;touch-action:none}
#cursor{position:absolute;top:8px;right:8px;background:var(--accent);color:#fff;padding:3px 6px;border-radius:4px;font-size:10px;font-weight:700;animation:pulse 2s ease-in-out infinite;opacity:0}

/* Chat/Score Panel */
.panel{width:280px;background:var(--panel);border-radius:16px;padding:20px;display:flex;flex-direction:column;height:fit-content}
.panel h3{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.msg-list{flex:1;overflow-y:auto;gap:6px;padding-right:6px}
.msg{display:flex;gap:6px;max-width:80%}
.msg .from{font-size:9px;color:var(--muted);margin-bottom:2px;display:block}
.msg-text{background:var(--card);padding:6px 8px;border-radius:8px;font-size:11px;line-height:1.3}
.msg.own .msg-text{border-radius:8px 8px 2px 8px}
.score{margin-top:auto;font-size:10px;color:var(--muted);text-align:right}

/* Input area */
.input-area{padding-top:12px;border-top:1px solid var(--border);display:flex;gap:6px;align-items:flex-end}
.inp{flex:1;padding:8px 10px;border:0;border-radius:18px;background:var(--card);color:var(--text);font-size:12px;outline:none}
.btn-submit{min-width:70px;padding:8px 12px;font-size:11px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:0;border-radius:18px;cursor:pointer}

/* Timer */
.timer{text-align:center;margin-top:10px;font-size:11px;color:var(--muted)}
.timer.warning{color:var(--error);animation:pulse 1s ease-in-out infinite alternate}

/* End game */
.end-game{padding:24px;text-align:center;display:none}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="hdr">
      <div class="title">
        <h1>🖌️ MrDrawing</h1>
        <p>Çiz & Tahmin Düellosu</p>
      </div>
      <div class="ctrls">
        <button class="btn btn-start" id="startBtn">Hızlı Eşleş →</button>
      </div>
    </div>
  </header>

  <main id="main" style="display:none">
    <div class="main">
      <div class="canvas-w">
        <canvas id="canvas" width="720" height="560"></canvas>
        <div id="status">Rakip bekleniyor...</div>
        <div id="cursor">Çiziyorsun</div>
      </div>

      <div class="panel">
        <h3>Tahminler</h3>
        <div class="msg-list" id="msgs">
          <div style="text-align:center;color:var(--muted);padding:8px;">Eşleşme bekleniyor...</div>
        </div>
        <div class="input-area">
          <input type="text" class="inp" id="guessInp" placeholder="Tahmin..." disabled>
          <button class="btn btn-submit" id="guessBtn" disabled>Gönder</button>
        </div>
        <div class="score" id="sc">0 : 0</div>
        <div class="timer" id="tmr">90s</div>
      </div>
    </div>
  </main>

  <div id="endGame" class="end-game">
    <h3 id="endTitle">Tebrikler!</h3>
    <p id="endMsg">Kelime: <span id="endWord"></span></p>
    <button class="btn btn-start" id="restartBtn">Yeniden Oyana →</button>
  </div>
</div>

<script>
/* Global state */
let ws=null, role='', word='', drawing=false, pts=[]
  , myScore={p1:0, p2:0}, round=0, maxRounds=3
  , isDrawer=false, oppName='Oyuncu2', remaining=90, timerId=null

/* DOM refs */
const S=(s)=>document.querySelector(s)
const M=(s,t='div'=>{const e=document.createElement(t);e.innerHTML=s;return e})
const CS=(s)=>document.querySelectorAll(s)

/* UI update helpers */
function setStatus(txt){ S('#status').textContent=txt }
function showMain(){ S('#main').style.display='flex'; S('#startBtn').style.display='none' }
function showEnd(tit,msg,kelime){ 
  S('#endTitle').textContent=tit; S('#endMsg').innerHTML='Kelime: <span id="endWord">'+kelime+'</span>'
  S('#endMsg>span').textContent=kelime; S('#endGame').style.display='block' 
}
function hideEnd(){ S('#endGame').style.display='none' }
function setScore(){ S('#sc').textContent=myScore.p1+' : '+myScore.p2 }
function setTimer(){ S('#tmr').textContent=remaining+'s'; S('#tmr').classList.remove('warning') }
function shake(){ S('#canvas').classList.add('shake'); setTimeout(()=>S('#canvas').classList.remove('shake'), 300) }

function logMsg(txt,who='opp'){
  const m=M('<div class="msg '+who+'"><div class="from">'+txt+'</div></div>')
  S('#msgs').append(m); S('#msgs').scrollTop=S('#msgs').scrollHeight
}

/* WebSocket */
function connectWS(){
  ws=new WebSocket('ws://'+location.hostname+':8080/ws')
  ws.onopen=()=>ws.send(JSON.stringify({t:'join',name:'Oyuncu1'}))
  ws.onmessage=e=>handleMsg(JSON.parse(e.data))
  ws.onclose=()=>{ setStatus('Bağlantı kesildi'); clearInterval(timerId); S('#startBtn').disabled=false }
  ws.onerror=()=>log('WS error')
}
function handleMsg(m){
  const t=m.t
  if(t==='waiting'){ setStatus('Rakip bekleniyor...') }
  else if(t==='start'){
    isDrawer=(m.role==='drawer'); role=m.role; word=m.word||''; oppName=m.opponent||'Oyuncu2'
    round=0; remaining=90; myScore={p1:0,p2:0}; setScore()
    setStatus((isDrawer?'ÇİZ':'TAHMİN ET!')+' '+word)
    showMain(); S('#guessInp').disabled=false; S('#guessBtn').disabled=false
    startTimer(); if(!isDrawer){ logMsg('Sana çiziliyor...','opp') }
  }
  else if(t==='draw'){ drawStroke(m.pts,m.c||'#111',m.w||4) }
  else if(t==='clear'){ ctx.clearRect(0,0,c.width,c.height) }
  else if(t==='guess'){ logMsg(m.from+': '+m.word,'opp') }
  else if(t==='correct'){
    const pid=isDrawer?'p1':'p2'; myScore[pid]= (myScore[pid]||0)+100; setScore()
    logMsg('✓ '+oppName+' bildi: '+word,'corr')
    shake(); clearRound()
  }
  else if(t==='opponent_left'){ 
    setStatus('Rakip ayrıldı'); S('#startBtn').disabled=false; hideEnd() 
  }
}

/* Timer */
function startTimer(){
  remaining=90; setTimer(); S('#tmr').classList.remove('warning')
  if(timerId) clearInterval(timerId)
  timerId=setInterval(()=>{remaining--; setTimer()
    if(remaining<=15){ S('#tmr').classList.add('warning') }
    if(remaining<=0){ clearRound() }
  },1000)
}

function clearRound(){
  clearInterval(timerId); ctx.clearRect(0,0,c.width,c.height)
  S('#guessInp').value=''; S('#guessInp').disabled=true; S('#guessBtn').disabled=true
  S('#tmr').textContent='90s'; S('#tmr').classList.remove('warning')
  const isW=isDrawer?myScore.p1>myScore.p2:myScore.p1<=myScore.p2
  setTimeout(()=>{ 
    round++; 
    if(round>=maxRounds){ showEnd('Maç Bitti',isDrawer?'Sen kazanıldı':'Rakip kazandı',word) }
    else { setStatus((isDrawer?'Yeni tur!':'Rakip tahmin ediyor!')); hideEnd() } 
  },2000)
}

/* Drawing */
function drawStroke(pts,c,w){ if(!pts||pts.length<2)return; ctx.strokeStyle=c; ctx.lineWidth=w||4; ctx.lineCap='round'; ctx.beginPath(); ctx.moveTo(pts[0].x,pts[0].y); for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i].x,pts[i].y); ctx.stroke() }

function pos(e){
  const r=c.getBoundingClientRect()
  const x=(e.touches&&e.touches[0]?e.touches[0].clientX:e.clientX)-r.left
  const y=(e.touches&&e.touches[0]?e.touches[0].clientY:e.clientY)-r.top
  const sx=c.width/r.width, sy=c.height/r.height
  return {x:x*sx, y:y*sy}
}

/* Events */
S('#startBtn').onclick=()=>{ S('#startBtn').disabled=true; setStatus('Bağlanılıyor...'); connectWS() }

S('#guessBtn').onclick=()=>{
  const v=S('#guessInp').value.trim().toLowerCase()
  if(!v)return; ws.send(JSON.stringify({t:'guess',word:v})); S('#guessInp').value=''
}
S('#guessInp').addEventListener('keydown',e=>{if(e.key==='Enter')S('#guessBtn').click()})

// Canvas: only drawer draws
S('#canvas').addEventListener('pointerdown',e=>{
  if(!isDrawer)return; drawing=true; pts=[pos(e)]; ctx.beginPath(); ctx.moveTo(pts[0].x,pts[0].y)
})
S('#canvas').addEventListener('pointermove',e=>{
  if(!drawing||!isDrawer)return; const p=pos(e); pts.push(p); ctx.lineTo(p.x,p.y); ctx.stroke()
})
S('#canvas').addEventListener('pointerup',e=>{
  if(!drawing||!isDrawer)return; drawing=false; ws&&ws.send(JSON.stringify({t:'draw',pts}))
})
S('#canvas').addEventListener('pointerleave',e=>{
  if(drawing||!isDrawer)return; drawing=false
})

/* Restart */
S('#restartBtn').onclick=()=>{ hideEnd(); S('#main').style.display='flex'; S('#startBtn').style.display='none'; round=0; startTimer() }

/* Init */
hideEnd(); S('#main').style.display='none'
</script>
</body></html>
