<!doctype html><html lang="tr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>MrDrawing</title>
<style>
:root{
  --bg:#0a0a12; --card:#11131e; --accent:#ff1744; --accent2:#7b2cbf;
  --text:#e8e8f0; --muted:#6b6b80; --success:#06d6a0; --error:#ff4466;
  --canvas-bg:#fff; --panel:#1a1d28;
}
* {box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',system-ui,Helvetica,Arial,sans-serif}
html,body {height:100%;overflow:hidden;background:var(--bg)}
#root {height:100%}

@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.5}}
@keyframes drawLine{0%{stroke-dashoffset:0}100%{stroke-dashoffset:-20}}

#app {height:100%;display:flex;flex-direction:column;background:var(--bg)}

header {padding:24px 32px;background:linear-gradient(135deg,var(--card),var(--bg));backdrop-filter:blur(20px)}
.header-content {max-width:1200px;margin:0 auto;display:flex;justify-content:space-between;align-items:center}
.title-area h1 {font-size:32px;font-weight:900;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.title-area p {color:var(--muted);font-size:14px;margin-top:4px}
.controls {display:flex;gap:12px;align-items:center}
.btn-start {padding:12px 24px;font-size:15px;font-weight:700;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:0;border-radius:8px;cursor:pointer;transition:transform 0.2s,box-shadow 0.2s;letter-spacing:0.5px}
.btn-start:hover {transform:translateY(-2px);box-shadow:0 8px 25px rgba(255,23,68,0.4)}
.btn-start:active {transform:translateY(0)}

.main-area {flex:1;display:flex;gap:8px;padding:32px;overflow:hidden}
.canvas-wrapper {flex:1;position:relative;background:var(--canvas-bg)}
#status {position:absolute;top:20px;left:20px;background:rgba(0,0,0,0.7);color:var(--text);padding:12px 20px;border-radius:8px;font-size:14px;font-weight:600;backdrop-filter:blur(5px)}
#canvas {width:100%;height:calc(100vh - 200px);background:#fff;border-radius:20px;display:block;touch-action:none;max-width:none}
.canvas-wrapper:hover #cursor-indicator {opacity:1}
#cursor-indicator {position:absolute;top:10px;right:10px;background:var(--accent);color:#fff;padding:4px 8px;border-radius:4px;font-size:11px;font-weight:700;opacity:0;animation: pulse 2s ease-in-out infinite}
.chat-panel {width:320px;background:var(--panel);border-radius:20px;padding:24px;display:flex;flex-direction:column;height:fit-max-content}
.chat-panel h3 {font-size:14px;font-weight:700;color:var(--muted);margin-bottom:16px;padding-bottom:8px;border-bottom:1px solid #2a2d38}
.messages {flex:1;overflow-y:auto;gap:8px;padding-right:8px}
.message {display:flex;gap:8px;max-width:80%}
.message.own {justify-content:flex-end}
.avatar {width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;color:#fff}
.avatar.opponent {background:#7b2cbf}
.avatar.me {background:#ff1744}
.message-text {background:var(--card);padding:8px 12px;border-radius:12px;font-size:12px;line-height:1.4}
.message.own .message-text {border-radius:12px 12px 4px 12px}
.message .from {font-size:10px;color:var(--muted);margin-bottom:2px;display:block}
.guess-area {padding:12px;border-top:1px solid #2a2d38;display:flex;gap:8px;align-items:flex-end}
.guess-input {flex:1;padding:8px 12px;border:0;border-radius:20px;background:var(--card);color:var(--text);font-size:13px;outline:none}
.guess-btn {padding:8px 16px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:0;border-radius:20px;font-size:12px;font-weight:700;cursor:pointer;min-width:80px}
.guess-btn:disabled {opacity:0.4;cursor:not-allowed}
.round-timer {text-align:center;margin-top:16px;font-size:12px;color:var(--muted)}
.round-timer.warning {color:var(--error);animation:pulse 1s ease-in-out infinite alternate}
.score {margin-top:auto;text-align:right;font-size:11px;color:var(--muted)}

@media (max-width:480px){.main-area{flex-direction:column-reverse;padding:16px}.chat-panel{width:100%}.messages{padding-right:0}}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="header-content">
      <div class="title-area">
        <h1>🖌️ MrDrawing</h1>
        <p>Split-screen çiz & tahmin duellosu</p>
      </div>
      <div class="controls">
        <button class="btn-start" id="startBtn">HIZLI EŞLEŞ →</button>
      </div>
    </div>
  </header>

  <main id="main" style="display:none">
    <div class="main-area">
      <div class="canvas-wrapper">
        <canvas id="canvas" width="700" height="520"></canvas>
        <div id="status">Rakip bekleniyor...</div>
        <div id="cursor-indicator">Çiziyorsun</div>
      </div>

      <div class="chat-panel">
        <h3>Tahminler</h3>
        <div class="messages" id="messages">
          <div style="text-align:center;color:var(--muted);padding:20px;">Henüz eşleşme yok</div>
        </div>
        <div class="guess-area">
          <input type="text" class="guess-input" id="guessInput" placeholder="Tahmin..." disabled>
          <button class="guess-btn" id="guessBtn" disabled>Gönder</button>
        </div>
        <div class="round-timer" id="timer">90s</div>
        <div class="score" id="score">0 : 0</div>
      </div>
    </div>
  </main>
</div>

<script>
let ws, role='', word='', drawing=false, pts=[], myScore={me:0, opp:0}, correctThisRound=false
  , startTime=0, timerInterval=0, remaining=90, isDrawer=false, opponentName='Rakip'

function $(s){return document.querySelector(s)}
function el(s,t='div'){const e=document.createElement(t);e.innerHTML=s;return e}

function connectWS(){ 
  ws = new WebSocket('ws://'+location.hostname+':8080/ws') 
  ws.onopen = () => ws.send(JSON.stringify({t:'join',name:'Oyuncu'}))
  ws.onmessage = e => handleMsg(JSON.parse(e.data))
  ws.onclose = () => { $('#status').textContent='Bağlantı kesildi'; $('#startBtn').disabled=false; clearInterval(timerInterval) }
  ws.onerror = () => log('WS error')
}

function handleMsg(m){
  switch(m.t){
    case 'waiting': $('#status').textContent='Rakip bekleniyor...'; break
    case 'start': 
      isDrawer=m.role==='drawer'; role=m.role; word=m.word||''; opponentName=m.opponent||'Rakip'
      $('#status').textContent=isDrawer?'ÇİZ: '+word:'TAHMİN ET!'
      $('#startBtn').style.display='none'
      $('#main').style.display='flex'
      $('#guessInput').disabled=false; $('#guessBtn').disabled=false
      startTimer()
      if(!isDrawer){ logMessage('Sana çiziliyor...','opponent') }
      break
    case 'draw': drawStroke(m.pts,m.c||'#111',m.w||4); break
    case 'clear': ctx.clearRect(0,0,c.width,c.height); break
    case 'guess': logMessage(`${m.from}: ${m.word}`,'opponent'); break
    case 'correct': 
      myScore[m.role===?'me':'opp']+=100; $('#score').textContent=`${myScore.me} : ${myScore.opp}`
      logMessage(`✓ ${m.by} bildi: ${word}`,'correct')
      clearRound(); break
    case 'opponent_left': $('#status').textContent='Rakip ayrıldı'; break
  }
}

function logMessage(txt,type='me'){
  const m = el(`<div class="message ${type}"><div class="from">${txt}</div></div>`)
  $('#messages').append(m); $('#messages').scrollTop = $('#messages').scrollHeight
}

function startTimer(){
  remaining=90; $('#timer').textContent=`${remaining}s`
  timerInterval=setInterval(()=>{remaining--; $('#timer').textContent=`${remaining}s`; 
    if(remaining<=15) $('#timer').classList.add('warning')
    if(remaining<=0){ clearRound() }}, 1000)
  $('#timer').classList.remove('warning')
}

function clearRound(){ 
  clearInterval(timerInterval) 
  ctx.clearRect(0,0,c.width,c.height)
  $('#guessInput').value=''; $('#guessInput').disabled=true; $('#guessBtn').disabled=true
  $('#timer').textContent='90s'; $('#timer').classList.remove('warning')
  $('#status').textContent=isDrawer?'Doğru bildin! Yeni tur...':'Rakip cevap veremedi!'
  setTimeout(()=>{ $('#status').textContent=isDrawer?'Yeni tur!':'Yeni tur!'; $('#main').style.display='none'; $('#startBtn').style.display='block' }, 2000)
}

function drawStroke(pts,c,w){ if(!pts||pts.length<2)return; ctx.strokeStyle=c; ctx.lineWidth=w; ctx.lineCap='round'; ctx.beginPath(); ctx.moveTo(pts[0].x,pts[0].y); for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i].x,pts[i].y); ctx.stroke() }

function pos(e){ const r=c.getBoundingClientRect(); const x=(e.touches?e.touches[0].clientX:e.clientX)-r.left; const y=(e.touches?e.touches[0].clientY:e.clientY)-r.top; const sx=c.width/r.width, sy=c.height/r.height; return {x:x*sx, y:y*sy} }

function $(s){return document.querySelector(s)}

$('#startBtn').onclick = ()=>{ $('#startBtn').disabled=true; $('#status').textContent='Bağlanılıyor...'; connectWS() }

$('#guessBtn').onclick = ()=>{ 
  const v=$('#guessInput').value.trim().toLowerCase() 
  if(!v)return; ws.send(JSON.stringify({t:'guess',word:v})); $('#guessInput').value='' 
}

$('#guessInput').addEventListener('keydown',e=>{ if(e.key==='Enter')$('#guessBtn').click() })

// Canvas events - sadece çizer ise
let cur=null
$('#canvas').addEventListener('pointerdown',e=>{ 
  if(!isDrawer)return; drawing=true; cur=[pos(e)]; ctx.beginPath(); ctx.moveTo(cur[0].x,cur[0].y) 
})
$('#canvas').addEventListener('pointermove',e=>{ 
  if(!drawing||!isDrawer)return; const p=pos(e); pts.push(p); ctx.lineTo(p.x,p.y); ctx.stroke() 
})
$('#canvas').addEventListener('pointerup',e=>{ 
  if(!drawing||!isDrawer)return; drawing=false; ws&&ws.send(JSON.stringify({t:'draw',pts})) 
  // after drawing, auto-guess check could go here
})
$('#canvas').addEventListener('pointerleave',e=>{ if(drawing||!isDrawer)return; drawing=false })

 // auto clear after correct or timer end functions already defined

 // fullscreen toggle
 $('#canvas').style.maxWidth='100vw'; $('#canvas').style.height='calc(100vh - 200px)'

 // init
 $('#main').style.display='none'
</script>
</body></html>
